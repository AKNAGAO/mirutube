<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MiruTube</title>
<style>
  :root {
    --bg: #ffffff; --bg2: #f2f2f2; --bg3: #e5e5e5; --fg: #0f0f0f; --fg2: #606060;
    --accent: #ff1f3d; --accent-fg: #fff; --border: #e0e0e0; --shadow: rgba(0,0,0,.15);
  }
  :root[data-theme="dark"] {
    --bg: #0f0f0f; --bg2: #222; --bg3: #333; --fg: #f1f1f1; --fg2: #aaa;
    --accent: #ff3b55; --accent-fg: #fff; --border: #303030; --shadow: rgba(0,0,0,.6);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, textarea { font: inherit; color: var(--fg); background: var(--bg); }

  /* header */
  header { position: sticky; top: 0; z-index: 10; height: 56px; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: var(--bg); }
  .menu-btn, .icon-btn { width: 40px; height: 40px; border: 0; border-radius: 50%; background: transparent; display: grid; place-items: center; }
  .menu-btn:hover, .icon-btn:hover { background: var(--bg2); }
  .logo { display: flex; align-items: center; gap: 4px; font-weight: 800; font-size: 21px; letter-spacing: -1px; }
  .logo .text b { color: var(--accent); }
  .logo-mark { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
  .logo-mark::after { content: ""; border-left: 9px solid var(--accent-fg); border-top: 6px solid transparent; border-bottom: 6px solid transparent; margin-left: 2px; }
  .search { flex: 1; max-width: 640px; margin: 0 auto; display: flex; }
  .search input { flex: 1; min-width: 0; height: 40px; padding: 0 16px; border: 1px solid var(--border); border-right: 0; border-radius: 20px 0 0 20px; outline: none; }
  .search input:focus { border-color: var(--accent); }
  .search button { width: 64px; border: 1px solid var(--border); border-radius: 0 20px 20px 0; background: var(--bg2); }
  .upload-btn { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: var(--bg2); font-weight: 600; }
  .upload-btn:hover { background: var(--bg3); }

  /* layout */
  .layout { display: flex; }
  nav.side { width: 220px; flex-shrink: 0; padding: 12px; position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; }
  body.side-collapsed nav.side { display: none; }
  nav.side a { display: flex; align-items: center; gap: 20px; padding: 10px 12px; border-radius: 10px; font-size: 14px; }
  nav.side a:hover { background: var(--bg2); }
  nav.side a.active { background: var(--bg2); font-weight: 600; }
  nav.side h4 { margin: 16px 12px 6px; font-size: 15px; }
  nav.side hr { border: 0; border-top: 1px solid var(--border); margin: 12px 0; }
  main { flex: 1; min-width: 0; padding: 16px 24px 48px; }

  /* grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 32px 16px; }
  .card .thumb { display: block; position: relative; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: var(--bg3); }
  .card .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .2s; }
  .card:hover .thumb img { transform: scale(1.03); }
  .dur { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.8); color: #fff; font-size: 12px; font-weight: 600; padding: 1px 4px; border-radius: 4px; }
  .card .info { display: flex; gap: 12px; margin-top: 12px; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 15px; }
  .card h3 { margin: 0 0 4px; font-size: 16px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { color: var(--fg2); font-size: 14px; line-height: 1.5; }
  .chips { display: flex; gap: 12px; margin-bottom: 20px; overflow-x: auto; }
  .chip { white-space: nowrap; padding: 6px 12px; border-radius: 8px; background: var(--bg2); border: 0; font-size: 14px; font-weight: 500; }
  .chip.active { background: var(--fg); color: var(--bg); }

  /* watch */
  .watch { display: flex; gap: 24px; max-width: 1700px; }
  .watch > .primary { flex: 1; min-width: 0; }
  .watch .secondary { width: 400px; flex-shrink: 0; }
  .player { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; display: block; }
  .watch h1 { font-size: 20px; margin: 12px 0 8px; }
  .owner-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .owner-row .channel-name { font-weight: 600; }
  .sub-btn { margin-left: 8px; height: 36px; padding: 0 16px; border: 0; border-radius: 18px; background: var(--fg); color: var(--bg); font-weight: 600; }
  .sub-btn.on { background: var(--bg2); color: var(--fg); }
  .actions { margin-left: auto; display: flex; gap: 8px; }
  .pill { display: flex; align-items: center; background: var(--bg2); border-radius: 18px; overflow: hidden; }
  .pill button { height: 36px; border: 0; background: transparent; padding: 0 14px; display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 14px; }
  .pill button:hover { background: var(--bg3); }
  .pill button.on { color: var(--accent); }
  .pill .sep { width: 1px; height: 24px; background: var(--border); }
  .desc { margin-top: 12px; background: var(--bg2); border-radius: 12px; padding: 12px; font-size: 14px; white-space: pre-wrap; line-height: 1.6; }
  .desc b { display: block; margin-bottom: 4px; }
  .comments h2 { font-size: 20px; margin: 24px 0 16px; }
  .comment-form { display: flex; gap: 12px; margin-bottom: 24px; }
  .comment-form .fields { flex: 1; }
  .comment-form input { width: 100%; border: 0; border-bottom: 1px solid var(--border); padding: 6px 0; outline: none; background: transparent; }
  .comment-form input:focus { border-bottom: 2px solid var(--fg); }
  .comment-form .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  .btn { height: 36px; padding: 0 16px; border: 0; border-radius: 18px; background: transparent; font-weight: 600; }
  .btn:hover { background: var(--bg2); }
  .btn.primary { background: var(--accent); color: var(--accent-fg); }
  .btn.primary:disabled { background: var(--bg2); color: var(--fg2); cursor: default; }
  .comment { display: flex; gap: 12px; margin-bottom: 20px; font-size: 14px; }
  .comment .who { font-weight: 600; font-size: 13px; }
  .comment .who span { color: var(--fg2); font-weight: 400; margin-left: 4px; }
  .comment p { margin: 4px 0 0; white-space: pre-wrap; line-height: 1.5; }
  .related { display: flex; gap: 8px; margin-bottom: 8px; }
  .related .thumb { width: 168px; flex-shrink: 0; position: relative; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: var(--bg3); }
  .related .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .related h3 { font-size: 14px; margin: 0 0 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .related .meta { font-size: 12px; }

  /* list rows (search/history) */
  .row { display: flex; gap: 16px; margin-bottom: 16px; max-width: 1100px; }
  .row .thumb { width: 360px; flex-shrink: 0; position: relative; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: var(--bg3); }
  .row .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .row h3 { margin: 0 0 6px; font-size: 18px; }
  .row .snip { color: var(--fg2); font-size: 12px; margin-top: 8px; }

  .page-title { font-size: 24px; margin: 4px 0 20px; display: flex; align-items: center; gap: 12px; }
  .empty { text-align: center; padding: 80px 16px; color: var(--fg2); }
  .empty .big { font-size: 56px; margin-bottom: 8px; }
  .empty h2 { color: var(--fg); }
  .channel-head { display: flex; align-items: center; gap: 20px; margin-bottom: 24px; }
  .channel-head .avatar { width: 96px; height: 96px; font-size: 40px; }
  .channel-head h1 { margin: 0 0 4px; }

  /* modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .modal-bg.open { display: flex; }
  .modal { width: 100%; max-width: 560px; background: var(--bg); border-radius: 16px; box-shadow: 0 8px 40px var(--shadow); padding: 24px; max-height: 90vh; overflow-y: auto; }
  .modal h2 { margin: 0 0 16px; }
  .drop { border: 2px dashed var(--border); border-radius: 12px; padding: 32px 16px; text-align: center; color: var(--fg2); cursor: pointer; }
  .drop.over { border-color: var(--accent); background: var(--bg2); }
  .drop img { max-width: 100%; border-radius: 8px; }
  .field { margin-top: 14px; }
  .field label { display: block; font-size: 13px; color: var(--fg2); margin-bottom: 4px; }
  .field input, .field textarea { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; outline: none; }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }
  .modal .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .toast { position: fixed; left: 16px; bottom: 16px; background: var(--fg); color: var(--bg); padding: 12px 16px; border-radius: 8px; opacity: 0; transform: translateY(10px); transition: .2s; pointer-events: none; z-index: 200; }
  .toast.show { opacity: 1; transform: none; }
  .del-btn { color: #d33; }

  /* notifications */
  .bell-wrap { position: relative; }
  .badge { position: absolute; top: 2px; right: 0; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: #e5383b; color: #fff; font-size: 11px; font-weight: 700; display: none; align-items: center; justify-content: center; border: 2px solid var(--bg); }
  .badge.show { display: flex; }
  .notif-panel { position: absolute; right: 0; top: 46px; width: 380px; max-width: calc(100vw - 16px); max-height: 70vh; overflow-y: auto; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 30px var(--shadow); display: none; z-index: 50; }
  .notif-panel.open { display: block; }
  .notif-panel h3 { margin: 0; padding: 12px 16px; font-size: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .notif { display: flex; gap: 12px; padding: 12px 16px; font-size: 14px; align-items: flex-start; }
  .notif:hover { background: var(--bg2); }
  .notif.unread::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-top: 8px; flex-shrink: 0; }
  .notif img { width: 86px; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; margin-left: auto; flex-shrink: 0; }
  .notif .meta { font-size: 12px; margin-top: 2px; }

  /* shorts */
  .shelf-title { font-size: 20px; font-weight: 700; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  .shelf { display: grid; grid-auto-flow: column; grid-auto-columns: 200px; gap: 12px; overflow-x: auto; margin-bottom: 32px; padding-bottom: 8px; }
  .short-card .thumb { aspect-ratio: 9/16; border-radius: 12px; overflow: hidden; background: var(--bg3); }
  .short-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .short-card h3 { font-size: 15px; margin: 8px 0 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  main.shorts-main { padding: 0; }
  .shorts-feed { height: calc(100vh - 56px); overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; }
  .short { height: 100%; scroll-snap-align: start; display: flex; justify-content: center; align-items: center; gap: 16px; padding: 12px 0; }
  .short-frame { height: 100%; aspect-ratio: 9/16; max-width: calc(100vw - 96px); position: relative; border-radius: 12px; overflow: hidden; background: #000; }
  .short-frame video { width: 100%; height: 100%; object-fit: cover; display: block; cursor: pointer; }
  .short-overlay { position: absolute; left: 0; right: 0; bottom: 0; padding: 48px 16px 16px; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.7)); pointer-events: none; }
  .short-overlay > * { pointer-events: auto; }
  .short-overlay .ch { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
  .short-overlay .t { margin-top: 8px; font-size: 15px; }
  .short-overlay .sub-btn { height: 30px; font-size: 13px; background: #fff; color: #000; }
  .short-overlay .sub-btn.on { background: rgba(255,255,255,.25); color: #fff; }
  .short-actions { display: flex; flex-direction: column; gap: 14px; align-self: flex-end; padding-bottom: 8px; }
  .short-actions button { width: 48px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; }
  .short-actions button i { font-style: normal; width: 48px; height: 48px; border-radius: 50%; background: var(--bg2); display: grid; place-items: center; font-size: 20px; }
  .short-actions button.on i { background: var(--accent); }
  .paused-icon { position: absolute; inset: 0; display: none; place-items: center; font-size: 64px; color: #fff; pointer-events: none; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
  .short-frame.paused .paused-icon { display: grid; }

  /* playlists */
  .pl-panel { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
  .pl-panel .head { padding: 12px 16px; background: var(--bg2); }
  .pl-panel .head b { display: block; font-size: 18px; }
  .pl-panel .items { max-height: 400px; overflow-y: auto; padding: 8px 0; }
  .pl-item { display: flex; gap: 8px; padding: 6px 12px; align-items: center; font-size: 13px; }
  .pl-item:hover { background: var(--bg2); }
  .pl-item.cur { background: var(--bg3); }
  .pl-item .n { width: 18px; color: var(--fg2); text-align: center; flex-shrink: 0; }
  .pl-item img { width: 100px; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  .pl-card .thumb { position: relative; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: var(--bg3); }
  .pl-card .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .pl-card .count { position: absolute; right: 0; top: 0; bottom: 0; width: 40%; background: rgba(0,0,0,.75); color: #fff; display: grid; place-items: center; font-weight: 600; text-align: center; }
  .pl-card h3 { margin: 10px 0 2px; font-size: 16px; }
  .check-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; font-size: 15px; cursor: pointer; }
  .check-row input { width: 18px; height: 18px; accent-color: var(--accent); }
  .inline-form { display: flex; gap: 8px; margin-top: 12px; }
  .inline-form input { flex: 1; min-width: 0; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; outline: none; }

  /* mobile-only parts (hidden on desktop) */
  .mobile-only { display: none !important; }
  .bottom-nav { display: none; }
  .search .back-btn { display: none; }

  /* my page */
  .hist-shelf { grid-auto-columns: 168px; }
  .hist-card .thumb { position: relative; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: var(--bg3); }
  .hist-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hist-card h3 { font-size: 13px; margin: 6px 0 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .hist-card .meta { font-size: 12px; }
  .my-links a { display: flex; align-items: center; gap: 16px; padding: 14px 4px; border-bottom: 1px solid var(--border); font-size: 15px; }

  @media (max-width: 1000px) {
    .watch { flex-direction: column; }
    .watch .secondary { width: 100%; }
    nav.side { display: none; }
    body.side-open nav.side { display: block; position: fixed; left: 0; background: var(--bg); z-index: 20; box-shadow: 4px 0 20px var(--shadow); }
    /* dim the page behind the drawer; tapping it closes the drawer */
    body.side-open::after { content: ""; position: fixed; inset: 56px 0 0 0; background: rgba(0,0,0,.4); z-index: 15; }
  }
  @media (max-width: 640px) {
    header { gap: 4px; padding: 0 4px 0 8px; height: 52px; }
    .menu-btn, .icon-btn { width: 40px; height: 40px; }
    .mobile-only { display: grid !important; }
    header .search, .upload-btn { display: none; }
    .logo { margin-right: auto; font-size: 19px; }
    /* search mode: header becomes a full-width search bar */
    body.search-mode header > *:not(.search) { display: none !important; }
    body.search-mode header .search { display: flex; max-width: none; margin: 0; }
    .search .back-btn { display: grid; width: 40px; border: 0; background: transparent; place-items: center; flex-shrink: 0; }
    .search input { font-size: 16px; border-radius: 20px 0 0 20px; }   /* 16px prevents iOS zoom on focus */
    .search button[type=submit] { width: 52px; }

    nav.side { top: 52px; height: calc(100vh - 52px - 56px); }
    body.side-open::after { inset: 52px 0 0 0; }
    main { padding: 12px 12px calc(72px + env(safe-area-inset-bottom)); }

    /* bottom tab bar */
    .bottom-nav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; height: calc(56px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); background: var(--bg); border-top: 1px solid var(--border); }
    .bottom-nav a, .bottom-nav button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; background: transparent; font-size: 10px; color: var(--fg2); -webkit-tap-highlight-color: transparent; }
    .bottom-nav .ico { font-size: 20px; line-height: 1; filter: grayscale(1); opacity: .75; }
    .bottom-nav a.active { color: var(--fg); font-weight: 700; }
    .bottom-nav a.active .ico { filter: none; opacity: 1; }
    .bottom-nav .create .ico { width: 44px; height: 30px; border-radius: 15px; border: 1.5px solid var(--fg); display: grid; place-items: center; font-size: 22px; filter: none; opacity: 1; color: var(--fg); }
    .toast { bottom: calc(68px + env(safe-area-inset-bottom)); }

    /* home: full-bleed thumbnails like a phone app */
    .grid { grid-template-columns: 1fr; gap: 24px; margin: 0 -12px; }
    .card .thumb { border-radius: 0; }
    .card:hover .thumb img { transform: none; }
    .card .info { padding: 0 12px; margin-top: 10px; }
    .card h3 { font-size: 15px; }
    .meta { font-size: 13px; }
    .chips { margin: 0 -12px 16px; padding: 0 12px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .shelf { grid-auto-columns: 42vw; margin-right: -12px; padding-right: 12px; }
    .shelf-title { font-size: 18px; }

    /* watch page */
    .watch > .primary { margin: -12px -12px 0; }
    .player { border-radius: 0; position: sticky; top: 52px; z-index: 5; }
    .watch > .primary > :not(.player) { margin-left: 12px; margin-right: 12px; }
    .watch h1 { font-size: 17px; line-height: 1.4; }
    .owner-row .sub-btn { margin-left: auto; }
    .actions { margin: 4px -12px 0; padding: 0 12px; width: calc(100% + 24px); overflow-x: auto; scrollbar-width: none; }
    .actions::-webkit-scrollbar { display: none; }
    .actions .pill { flex-shrink: 0; }
    .comment-form .btns .btn { height: 32px; }
    .related .thumb { width: 150px; }
    .related h3 { font-size: 13px; }

    /* lists */
    .row { flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .row .thumb { width: calc(100% + 24px); margin: 0 -12px; border-radius: 0; }
    .row h3 { font-size: 16px; }
    .page-title { font-size: 20px; flex-wrap: wrap; gap: 8px; }
    .channel-head { gap: 14px; }
    .channel-head .avatar { width: 72px; height: 72px; font-size: 30px; }
    .channel-head h1 { font-size: 22px; }
    .empty { padding: 48px 8px; }

    /* shorts: full-screen with overlaid buttons */
    .shorts-feed { height: calc(100vh - 52px - 56px - env(safe-area-inset-bottom)); height: calc(100dvh - 52px - 56px - env(safe-area-inset-bottom)); }
    .short { padding: 0; position: relative; }
    .short-frame { width: 100%; max-width: none; aspect-ratio: auto; border-radius: 0; }
    .short-overlay { padding: 48px 76px 16px 14px; }
    .short-actions { position: absolute; right: 6px; bottom: 16px; gap: 10px; padding: 0; }
    .short-actions button { color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.7); }
    .short-actions button i { background: rgba(0,0,0,.35); width: 44px; height: 44px; }
    .short-actions button.on i { background: var(--accent); }

    /* modals become bottom sheets; notification panel spans the screen */
    .modal-bg { padding: 0; align-items: flex-end; }
    .modal { border-radius: 16px 16px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); max-height: 92vh; max-width: none !important; }
    .field input, .field textarea { font-size: 16px; }
    .notif-panel { position: fixed; left: 8px; right: 8px; top: 52px; width: auto; max-width: none; }
  }
</style>
</head>
<body>
<header>
  <button class="menu-btn" id="menuBtn" aria-label="メニュー">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
  </button>
  <a class="logo" href="#/"><span class="logo-mark"></span><span class="text">Miru<b>Tube</b></span></a>
  <form class="search" id="searchForm">
    <button type="button" class="back-btn" id="searchBack" aria-label="戻る">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>
    </button>
    <input id="q" type="search" placeholder="検索" autocomplete="off" enterkeyhint="search">
    <button type="submit" aria-label="検索">

    </button>
  </form>

    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 14 15.5l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
  </button>
  <button class="upload-btn" id="uploadBtn">

<div class="modal-bg" id="uploadModal">
  <form class="modal" id="uploadForm">
    <h2>動画をアップロード</h2>
    <div class="drop" id="drop">
      <div id="dropInner">クリックまたは動画ファイルをドラッグ&ドロップ</div>
      <input type="file" id="file" accept="video/*" hidden>
    </div>
    <div class="field"><label>タイトル（必須）</label><input id="upTitle" maxlength="100" required></div>
    <div class="field"><label>説明</label><textarea id="upDesc" rows="4"></textarea></div>
    <div class="field"><label>チャンネル名</label><input id="upChannel" maxlength="40" required></div>
    <label class="check-row"><input type="checkbox" id="upShort"> ショート動画として公開（縦長・60秒以下なら自動でオン）</label>

      <button type="submit" class="btn primary" id="doUpload" disabled>公開</button>
    </div>

</div>
<div class="modal-bg" id="saveModal">
  <div class="modal" style="max-width:380px">
    <h2>再生リストに保存</h2>
    <div id="plChecks"></div>
    <form class="inline-form" id="newPlForm">
      <input id="newPlName" placeholder="新しい再生リストの名前" maxlength="60">
      <button class="btn primary">作成</button>
    </form>
    <div class="btns"><button type="button" class="btn" id="closeSave">完了</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ---------- storage (IndexedDB) ----------
const DB_NAME = 'miru', DB_VER = 1;
let db;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('videos', { keyPath: 'id' });
      d.createObjectStore('kv');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn) {
  return new Promise((res, rej) => {
    const t = db.transaction(store, mode);
    const out = fn(t.objectStore(store));
    t.oncomplete = () => res(out && 'result' in out ? out.result : out);
    t.onerror = () => rej(t.error);
  });
}
const putVideo = v => tx('videos', 'readwrite', s => s.put(v));
const delVideo = id => tx('videos', 'readwrite', s => s.delete(id));
const allVideos = () => tx('videos', 'readonly', s => s.getAll());
const kvGet = k => tx('kv', 'readonly', s => s.get(k));
const kvSet = (k, v) => tx('kv', 'readwrite', s => s.put(v, k));

// ---------- state ----------
let videos = [];            // metadata + blob
let state = { subs: [], history: [], me: '', playlists: [], notifs: [] };
const blobUrls = new Map();
const WATCH_LATER = 'wl';

async function saveState() {
  await kvSet('state', state);
}

// ---------- notifications ----------
function notify(text, videoId) {
  state.notifs = [{ id: Date.now() + Math.random(), text, videoId, at: Date.now(), read: false }, ...state.notifs].slice(0, 50);
  saveState(); renderBell();
}
function renderBell() {
  const n = state.notifs.filter(x => !x.read).length;
  const b = $('#badge');
  b.textContent = n > 9 ? '9+' : n;
  b.classList.toggle('show', n > 0);
}
function renderNotifPanel() {
  const p = $('#notifPanel');
  p.innerHTML = `<h3>通知 ${state.notifs.length ? '<button class="btn" id="clearNotifs" style="height:28px;font-size:13px">すべて削除</button>' : ''}</h3>` +
    (state.notifs.map(n => {
      const v = videos.find(x => x.id === n.videoId);
      return `<a class="notif ${n.read ? '' : 'unread'}" href="${v ? '#/watch/' + v.id : '#/'}"><div><div>${esc(n.text)}</div><div class="meta">${ago(n.at)}</div></div>${v ? `<img src="${v.thumb}" alt="">` : ''}</a>`;
    }).join('') || '<div class="meta" style="padding:24px 16px;text-align:center">通知はまだありません</div>');
  const c = $('#clearNotifs');
  if (c) c.onclick = e => { e.stopPropagation(); state.notifs = []; saveState(); renderBell(); renderNotifPanel(); };
}

// ---------- playlists ----------
const getPl = id => state.playlists.find(p => p.id === id);
const plVideos = pl => pl.ids.map(id => videos.find(v => v.id === id)).filter(Boolean);
function setRating(v, r) {
  if (v.rating === 1) v.likes--;
  v.rating = v.rating === r ? 0 : r;
  if (v.rating === 1) v.likes++;
  if (v.rating === 1) toast('高く評価した動画に追加しました');
  return putVideo(v);
}
let saveTarget = null;
function openSave(v) {
  saveTarget = v;
  renderPlChecks();
  $('#newPlName').value = '';
  $('#saveModal').classList.add('open');
}
function renderPlChecks() {
  const v = saveTarget;
  $('#plChecks').innerHTML = state.playlists.map(p => `<label class="check-row"><input type="checkbox" data-pl="${p.id}" ${p.ids.includes(v.id) ? 'checked' : ''}>${esc(p.name)}</label>`).join('');
  $('#plChecks').querySelectorAll('[data-pl]').forEach(cb => cb.onchange = async () => {
    const p = getPl(cb.dataset.pl);
    p.ids = cb.checked ? [...p.ids, v.id] : p.ids.filter(x => x !== v.id);
    await saveState();
    toast(cb.checked ? `「${p.name}」に保存しました` : `「${p.name}」から削除しました`);
  });
}
function videoUrl(v) {
  if (!blobUrls.has(v.id)) blobUrls.set(v.id, URL.createObjectURL(v.blob));
  return blobUrls.get(v.id);
}

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function fmtDur(sec) {
  sec = Math.round(sec || 0);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
}
function fmtNum(n) {
  if (n >= 1e8) return (n / 1e8).toFixed(1).replace(/\.0$/, '') + '億';
  if (n >= 1e4) return (n / 1e4).toFixed(1).replace(/\.0$/, '') + '万';
  return String(n);
}
function ago(t) {
  const s = (Date.now() - t) / 1000;
  const units = [[31536000, '年'], [2592000, 'か月'], [604800, '週間'], [86400, '日'], [3600, '時間'], [60, '分']];
  for (const [u, l] of units) if (s >= u) return Math.floor(s / u) + l + '前';
  return 'たった今';
}
function color(name) {
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 360;
  return `hsl(${h} 55% 45%)`;
}
const avatar = (name, size) => `<a class="avatar" href="#/channel/${encodeURIComponent(name)}" style="background:${color(name)}${size ? `;width:${size}px;height:${size}px` : ''}">${esc(name.slice(0, 1).toUpperCase())}</a>`;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2200);
}
const thumbImg = v => `<img src="${v.thumb}" alt="" loading="lazy"><span class="dur">${fmtDur(v.duration)}</span>`;
const subCount = ch => videos.filter(v => v.channel === ch).reduce((a, v) => a + (v.subsBase || 0), 0) + (state.subs.includes(ch) ? 1 : 0);

// ---------- views ----------
const app = $('#app');

function card(v) {
  return `<div class="card">
    <a class="thumb" href="#/watch/${v.id}">${thumbImg(v)}</a>
    <div class="info">
      ${avatar(v.channel)}
      <div>
        <a href="#/watch/${v.id}"><h3>${esc(v.title)}</h3></a>
        <div class="meta"><a href="#/channel/${encodeURIComponent(v.channel)}">${esc(v.channel)}</a><br>${fmtNum(v.views)} 回視聴・${ago(v.createdAt)}</div>
      </div>
    </div>
  </div>`;
}
function row(v, extra = '') {
  return `<div class="row">
    <a class="thumb" href="#/watch/${v.id}">${thumbImg(v)}</a>
    <div>
      <a href="#/watch/${v.id}"><h3>${esc(v.title)}</h3></a>
      <div class="meta">${fmtNum(v.views)} 回視聴・${ago(v.createdAt)}</div>
      <div class="meta" style="display:flex;align-items:center;gap:8px;margin-top:8px">${avatar(v.channel, 24)}<a href="#/channel/${encodeURIComponent(v.channel)}">${esc(v.channel)}</a></div>
      <div class="snip">${esc((v.desc || '').slice(0, 120))}</div>
      ${extra}
    </div>
  </div>`;
}
const emptyView = (icon, title, text, btn = true) => `<div class="empty"><div class="big">${icon}</div><h2>${title}</h2><p>${text}</p>${btn ? '<button class="btn primary" onclick="openUpload()">動画をアップロード</button>' : ''}</div>`;

const shortCard = v => `<a class="short-card" href="#/shorts/${v.id}"><div class="thumb"><img src="${v.thumb}" alt="" loading="lazy"></div><h3>${esc(v.title)}</h3><div class="meta">${fmtNum(v.views)} 回視聴</div></a>`;

let homeFilter = 'すべて';
function viewHome() {
  if (!videos.length) {
    app.innerHTML = emptyView('🎬', 'まだ動画がありません', '右上の「作成」からパソコン内の動画ファイルをアップロードしてみましょう。') +
      '<div style="text-align:center;margin-top:-56px"><button class="btn" onclick="seedSamples()">✨ サンプル動画を追加</button></div>';
    return;
  }
  const shorts = videos.filter(v => v.short).sort((a, b) => b.createdAt - a.createdAt);
  const channels = [...new Set(videos.map(v => v.channel))];
  const chips = ['すべて', '新しい順', '人気順', ...channels];
  let list = videos.filter(v => !v.short);
  if (homeFilter === '人気順') list.sort((a, b) => b.views - a.views);
  else if (channels.includes(homeFilter)) list = list.filter(v => v.channel === homeFilter).sort((a, b) => b.createdAt - a.createdAt);
  else list.sort((a, b) => b.createdAt - a.createdAt);
  app.innerHTML = `<div class="chips">${chips.map(c => `<button class="chip ${c === homeFilter ? 'active' : ''}" data-chip="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    ${shorts.length && homeFilter === 'すべて' ? `<div class="shelf-title">⚡ ショート</div><div class="shelf">${shorts.map(shortCard).join('')}</div>` : ''}
    <div class="grid">${list.map(card).join('')}</div>`;
  app.querySelectorAll('[data-chip]').forEach(b => b.onclick = () => { homeFilter = b.dataset.chip; viewHome(); });
}

const MILESTONES = [10, 50, 100, 500, 1000, 10000];
function countView(v) {
  v.views++;
  state.history = [v.id, ...state.history.filter(x => x !== v.id)].slice(0, 200);
  putVideo(v); saveState();
  if (v.mine && MILESTONES.includes(v.views)) notify(`🎉「${v.title}」の視聴回数が ${v.views} 回を突破しました`, v.id);
}

async function viewWatch(id, listId) {
  const v = videos.find(x => x.id === id);
  if (!v) { app.innerHTML = emptyView('❓', '動画が見つかりません', '削除された可能性があります。', false); return; }

  countView(v);

  const subbed = state.subs.includes(v.channel);
  const related = videos.filter(x => x.id !== id).sort((a, b) => (b.channel === v.channel) - (a.channel === v.channel) || b.createdAt - a.createdAt);
  const pl = listId && getPl(listId);
  const plList = pl ? plVideos(pl) : [];
  const plIdx = plList.findIndex(x => x.id === id);
  const next = pl ? plList[plIdx + 1] : related[0];
  const plPanel = pl ? `<div class="pl-panel"><div class="head"><b>${esc(pl.name)}</b><span class="meta">${plIdx + 1} / ${plList.length}</span></div><div class="items">${plList.map((x, i) =>
    `<a class="pl-item ${x.id === id ? 'cur' : ''}" href="#/watch/${x.id}/${pl.id}"><span class="n">${x.id === id ? '▶' : i + 1}</span><img src="${x.thumb}" alt=""><div><div style="font-weight:600">${esc(x.title)}</div><div class="meta" style="font-size:12px">${esc(x.channel)}</div></div></a>`).join('')}</div></div>` : '';

  app.innerHTML = `<div class="watch">
    <div class="primary">
      <video class="player" id="player" src="${videoUrl(v)}" controls autoplay playsinline></video>
      <h1>${esc(v.title)}</h1>
      <div class="owner-row">
        ${avatar(v.channel, 40)}
        <div><a class="channel-name" href="#/channel/${encodeURIComponent(v.channel)}">${esc(v.channel)}</a><div class="meta" style="font-size:12px">チャンネル登録者数 ${fmtNum(subCount(v.channel))}人</div></div>
        <button class="sub-btn ${subbed ? 'on' : ''}" id="subBtn">${subbed ? '登録済み' : 'チャンネル登録'}</button>
        <div class="actions">
          <div class="pill">
            <button id="likeBtn" class="${v.rating === 1 ? 'on' : ''}">👍 ${fmtNum(v.likes)}</button>
            <span class="sep"></span>
            <button id="dislikeBtn" class="${v.rating === -1 ? 'on' : ''}">👎</button>
          </div>
          <div class="pill"><button id="shareBtn">↗ 共有</button></div>
          <div class="pill"><button id="saveBtn">＋ 保存</button></div>
          <div class="pill"><button id="delBtn" class="del-btn">🗑 削除</button></div>
        </div>
      </div>
      <div class="desc"><b>${fmtNum(v.views)} 回視聴・${new Date(v.createdAt).toLocaleDateString('ja-JP')}</b>${esc(v.desc || '説明はありません。')}</div>
      <div class="comments">
        <h2>${v.comments.length} 件のコメント</h2>
        <form class="comment-form" id="cForm">
          ${avatar(state.me || 'ゲスト')}
          <div class="fields">
            <input id="cText" placeholder="コメントする…" autocomplete="off">
            <div class="btns"><button type="button" class="btn" id="cCancel">キャンセル</button><button class="btn primary" id="cSend" disabled>コメント</button></div>
          </div>
        </form>
        <div id="cList">${v.comments.slice().reverse().map(c => `<div class="comment">${avatar(c.author)}<div><div class="who">@${esc(c.author)}<span>${ago(c.at)}</span></div><p>${esc(c.text)}</p></div></div>`).join('')}</div>
      </div>
    </div>
    <div class="secondary">
      ${plPanel}
      ${related.map(r => `<div class="related"><a class="thumb" href="#/watch/${r.id}">${thumbImg(r)}</a><div><a href="#/watch/${r.id}"><h3>${esc(r.title)}</h3></a><div class="meta">${esc(r.channel)}<br>${fmtNum(r.views)} 回視聴・${ago(r.createdAt)}</div></div></div>`).join('') || '<div class="meta">他の動画はまだありません。</div>'}
    </div>
  </div>`;

  // autoplay next video (in playlist, or related) when finished
  fixDuration($('#player'));
  $('#player').onended = e => { if (e.target._fixing) return; if (next) location.hash = '#/watch/' + next.id + (pl ? '/' + pl.id : ''); };
  $('#saveBtn').onclick = () => openSave(v);

  $('#subBtn').onclick = async () => {
    state.subs = state.subs.includes(v.channel) ? state.subs.filter(c => c !== v.channel) : [...state.subs, v.channel];
    await saveState(); renderSubs();
    toast(state.subs.includes(v.channel) ? 'チャンネル登録しました' : '登録を解除しました');
    const on = state.subs.includes(v.channel);
    $('#subBtn').className = 'sub-btn' + (on ? ' on' : '');
    $('#subBtn').textContent = on ? '登録済み' : 'チャンネル登録';
  };
  const rate = async r => {
    await setRating(v, r);
    $('#likeBtn').className = v.rating === 1 ? 'on' : '';
    $('#likeBtn').textContent = '👍 ' + fmtNum(v.likes);
    $('#dislikeBtn').className = v.rating === -1 ? 'on' : '';
  };
  $('#likeBtn').onclick = () => rate(1);
  $('#dislikeBtn').onclick = () => rate(-1);
  $('#shareBtn').onclick = async () => {
    try { await navigator.clipboard.writeText(location.href); toast('リンクをコピーしました'); } catch { toast(location.href); }
  };
  $('#delBtn').onclick = async () => {
    if (!confirm(`「${v.title}」を削除しますか？`)) return;
    await delVideo(v.id);
    videos = videos.filter(x => x.id !== v.id);
    state.history = state.history.filter(x => x !== v.id);
    state.playlists.forEach(p => p.ids = p.ids.filter(x => x !== v.id));
    await saveState(); renderSubs();
    toast('動画を削除しました');
    location.hash = '#/';
  };

  const cText = $('#cText'), cSend = $('#cSend');
  cText.oninput = () => cSend.disabled = !cText.value.trim();
  $('#cCancel').onclick = () => { cText.value = ''; cSend.disabled = true; };
  $('#cForm').onsubmit = async e => {
    e.preventDefault();
    const text = cText.value.trim();
    if (!text) return;
    if (!state.me) {
      const name = prompt('表示名を入力してください', 'ゲスト');
      if (!name) return;
      state.me = name.trim().slice(0, 30); await saveState();
    }
    v.comments.push({ author: state.me, text, at: Date.now() });
    await putVideo(v);
    viewWatchRefreshComments(v);
  };
}
// re-render only the comments section, so playback isn't interrupted
function viewWatchRefreshComments(v) {
  $('.comments h2').textContent = `${v.comments.length} 件のコメント`;
  $('#cList').innerHTML = v.comments.slice().reverse().map(c => `<div class="comment">${avatar(c.author)}<div><div class="who">@${esc(c.author)}<span>${ago(c.at)}</span></div><p>${esc(c.text)}</p></div></div>`).join('');
  $('#cText').value = ''; $('#cSend').disabled = true;
}

function viewSearch(q) {
  $('#q').value = q;
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = videos.filter(v => {
    const hay = (v.title + ' ' + v.desc + ' ' + v.channel).toLowerCase();
    return terms.every(t => hay.includes(t));
  }).sort((a, b) => b.views - a.views);
  app.innerHTML = `<div class="page-title">「${esc(q)}」の検索結果</div>` +
    (hits.length ? hits.map(v => row(v)).join('') : emptyView('🔍', '結果がありません', '別のキーワードを試してください。', false));
}

function viewList(title, list, emptyMsg, extraFn) {
  app.innerHTML = `<div class="page-title">${title}</div>` +
    (list.length ? list.map(v => row(v, extraFn ? extraFn(v) : '')).join('') : emptyView('📭', 'ここには何もありません', emptyMsg, false));
}

function viewHistory() {

function viewShorts(startId) {
  const list = videos.filter(v => v.short).sort((a, b) => b.createdAt - a.createdAt);
  if (!list.length) {

          <div class="t">${esc(v.title)}</div>
        </div>
      </div>
      <div class="short-actions">
        <button data-act="like" class="${v.rating === 1 ? 'on' : ''}"><i>👍</i><span>${fmtNum(v.likes)}</span></button>
        <button data-act="dislike" class="${v.rating === -1 ? 'on' : ''}"><i>👎</i><span>低評価</span></button>
        <button data-act="comment"><i>💬</i><span>${v.comments.length}</span></button>
        <button data-act="save"><i>＋</i><span>保存</span></button>
        <button data-act="share"><i>↗</i><span>共有</span></button>
      </div>
    </section>`).join('')}</div>`;

  const feed = $('#feed');
  const seen = new Set();
  feed.querySelectorAll('.short').forEach(sec => {
    const v = videos.find(x => x.id === sec.dataset.id);
    const vid = sec.querySelector('video'), frame = sec.querySelector('.short-frame');
    fixDuration(vid);
    vid.onclick = () => vid.paused ? vid.play() : vid.pause();
    vid.onplay = () => frame.classList.remove('paused');
    vid.onpause = () => frame.classList.add('paused');
    sec.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
      const act = b.dataset.act;
      if (act === 'like' || act === 'dislike') {
        await setRating(v, act === 'like' ? 1 : -1);
        sec.querySelector('[data-act=like]').className = v.rating === 1 ? 'on' : '';
        sec.querySelector('[data-act=like] span').textContent = fmtNum(v.likes);
        sec.querySelector('[data-act=dislike]').className = v.rating === -1 ? 'on' : '';
      } else if (act === 'sub') {
        const on = !state.subs.includes(v.channel);
        state.subs = on ? [...state.subs, v.channel] : state.subs.filter(c => c !== v.channel);
        await saveState(); renderSubs();
        feed.querySelectorAll('.short').forEach(s2 => {
          if (videos.find(x => x.id === s2.dataset.id).channel !== v.channel) return;
          const sb = s2.querySelector('[data-act=sub]');

        });
        toast(on ? 'チャンネル登録しました' : '登録を解除しました');
      } else if (act === 'comment') location.hash = '#/watch/' + v.id;
      else if (act === 'save') openSave(v);
      else if (act === 'share') {
        try { await navigator.clipboard.writeText(location.href.split('#')[0] + '#/shorts/' + v.id); toast('リンクをコピーしました'); } catch { toast('コピーできませんでした'); }
      }
    });
  });

  // play the short that's on screen, pause the rest
  shortsObserver = new IntersectionObserver(entries => entries.forEach(en => {
    const vid = en.target.querySelector('video'), id = en.target.dataset.id;
    if (en.isIntersecting) {
      if (!vid._fixing) vid.currentTime = 0;
      vid.play().catch(() => { vid.muted = true; vid.play().catch(() => {}); });
      if (!seen.has(id)) { seen.add(id); countView(videos.find(x => x.id === id)); }
      history.replaceState(null, '', '#/shorts/' + id);
    } else vid.pause();

  feed.querySelectorAll('.short').forEach(s => shortsObserver.observe(s));

  feed.tabIndex = 0; feed.focus();

// ---------- sample videos (drawn on canvas and recorded in the browser) ----------
// MediaRecorder output has no duration in its header (duration = Infinity), which breaks the seek bar.
// Seeking far past the end makes the browser compute the real duration.
function fixDuration(vid) {
  vid.addEventListener('loadedmetadata', () => {
    if (vid.duration !== Infinity) return;
    vid._fixing = true;
    const onChange = () => {
      if (vid.duration === Infinity) return;
      vid.removeEventListener('durationchange', onChange);
      vid.currentTime = 0;
      vid._fixing = false;
      if (vid.ended || (vid.autoplay && vid.paused)) vid.play().catch(() => {});
    };
    vid.addEventListener('durationchange', onChange);
    vid.currentTime = 1e101;
  });
}

function seededRandom(seed) {
  return () => {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

          p.x += p.vx; p.y += p.vy; p.vy += .05; p.vx *= .985; p.life -= .012;
          ctx.fillStyle = `hsla(${p.hue} 100% 65% / ${p.life})`; ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, 7); ctx.fill();
        }
      };
    },
  },
  {
    title: 'ぷるぷるボールの1日 #shorts', channel: 'モーション研究所', w: 360, h: 640, dur: 6, thumbAt: .3, short: true,
    views: 87300, likes: 5400, days: 6, subs: 0,
    desc: 'はねるたびにぷるっとするボールです🟠',
    make: (W, H) => (ctx, t) => {
      const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#ffe3ec'); g.addColorStop(1, '#d9f0ff');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      const floor = H * .78, ph = (t * 1.4) % 1, hgt = Math.abs(Math.sin(ph * Math.PI)) * 300;
      const squash = hgt < 30 ? 1 - (30 - hgt) / 30 * .35 : 1 + Math.min(.15, hgt / 2000);
      const rx = 60 / Math.sqrt(squash), ry = 60 * squash, cy = floor - hgt - ry;
      ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.beginPath(); ctx.ellipse(W / 2, floor + 6, 60 * (1 - hgt / 600), 10, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#ff8a3d'; ctx.beginPath(); ctx.ellipse(W / 2, cy, rx, ry, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.ellipse(W / 2 - rx * .35, cy - ry * .4, rx * .2, ry * .12, -.5, 0, 7); ctx.fill();
      ctx.fillStyle = '#3a2410';
      ctx.beginPath(); ctx.arc(W / 2 - 18, cy - 6, 6, 0, 7); ctx.arc(W / 2 + 18, cy - 6, 6, 0, 7); ctx.fill();
      ctx.strokeStyle = '#3a2410'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(W / 2, cy + 6, 12, .2, Math.PI - .2); ctx.stroke();
      ctx.fillStyle = '#ff5c8a'; ctx.font = `bold 34px ${JP_FONT}`; ctx.textAlign = 'center'; ctx.fillText('ぷるぷる〜', W / 2, 110); ctx.textAlign = 'left';
    },
  },
  {
    title: '5秒カウントダウン⏱ 動画のオープニングに！ #shorts', channel: 'まなびチャンネル', w: 360, h: 640, dur: 6, thumbAt: .1, short: true,
    views: 15800, likes: 640, days: 12, subs: 0,
    desc: '動画の冒頭などにどうぞ。',
    make: (W, H) => (ctx, t) => {
      const n = Math.max(0, 5 - Math.floor(t)), f = t % 1, hue = n * 55;
      ctx.fillStyle = `hsl(${hue} 70% 18%)`; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = `hsl(${hue} 90% 60%)`; ctx.lineWidth = 14; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(W / 2, H / 2, 120, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - f)); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `bold ${n ? 150 + f * 20 : 64}px ${JP_FONT}`; ctx.fillText(n ? n : 'スタート！', W / 2, H / 2 + 6);
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    },
  },
];

const SAMPLE_COMMENTS = [
  ['sora_77', 'これめっちゃ好きです！'], ['みかん', '作業中にずっと流してます'], ['Kenta', '色がきれい…'],
  ['ねこまる', '何回も見ちゃう😂'], ['hana', '次の動画も楽しみにしてます！'], ['たろう', 'わかりやすかったです、ありがとうございます'],
];

function sampleThumb(src, s) {
  const c = document.createElement('canvas'); c.width = 480; c.height = 270;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, 480, 270);
  const r = Math.min(480 / src.width, 270 / src.height), w = src.width * r, h = src.height * r;
  ctx.drawImage(src, (480 - w) / 2, (270 - h) / 2, w, h);
  if (s.caption) {
    ctx.font = `900 46px ${JP_FONT}`; ctx.lineJoin = 'round';
    ctx.lineWidth = 10; ctx.strokeStyle = '#000'; ctx.strokeText(s.caption, 22, 240);
    ctx.fillStyle = '#ffe14d'; ctx.fillText(s.caption, 22, 240);
  }
  return c.toDataURL('image/jpeg', .85);
}

function recordSample(s) {
  return new Promise((res, rej) => {
    const c = document.createElement('canvas'); c.width = s.w; c.height = s.h;
    const ctx = c.getContext('2d'), draw = s.make(s.w, s.h);
    const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
    draw(ctx, 0);
    const rec = new MediaRecorder(c.captureStream(30), { mimeType: mime, videoBitsPerSecond: 2500000 });
    const chunks = []; let thumb = null;
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => res({ blob: new Blob(chunks, { type: 'video/webm' }), thumb: thumb || sampleThumb(c, s) });
    rec.onerror = e => rej(e.error || e);
    rec.start(500);
    const start = performance.now();
    const iv = setInterval(() => {
      const t = (performance.now() - start) / 1000;
      if (t >= s.dur) { clearInterval(iv); rec.stop(); return; }
      draw(ctx, t);
      if (!thumb && t >= s.dur * s.thumbAt) thumb = sampleThumb(c, s);
    }, 1000 / 30);
  });
}

let seeding = false;
async function seedSamples() {
  if (seeding) return;
  if (!window.MediaRecorder || !HTMLCanvasElement.prototype.captureStream) { toast('このブラウザではサンプル動画を作成できません'); return; }
  seeding = true;
  const longest = Math.max(...SAMPLES.map(s => s.dur));
  app.innerHTML = `<div class="empty"><div class="big">✨</div><h2>サンプル動画を作成しています…</h2><p>約${longest}秒かかります。このままお待ちください。</p>
    <div style="max-width:320px;height:6px;margin:16px auto;background:var(--bg2);border-radius:3px;overflow:hidden"><div id="seedBar" style="height:100%;width:0;background:var(--accent);transition:width .3s linear"></div></div></div>`;
  const t0 = Date.now();
  const bar = setInterval(() => { const b = $('#seedBar'); if (b) b.style.width = Math.min(100, (Date.now() - t0) / 10 / longest) + '%'; }, 300);
  try {
    const clips = await Promise.all(SAMPLES.map(recordSample));
    const rnd = seededRandom(99);
    for (let i = 0; i < SAMPLES.length; i++) {
      const s = SAMPLES[i];
      const createdAt = Date.now() - s.days * 86400000 - Math.floor(rnd() * 20) * 3600000;
      const comments = SAMPLE_COMMENTS.filter(() => rnd() < .5).map(([author, text], j) => ({ author, text, at: createdAt + (j + 1) * 3600000 * (1 + rnd() * 20) }));
      const v = {
        id: Math.random().toString(36).slice(2, 13), title: s.title, desc: s.desc, channel: s.channel,
        blob: clips[i].blob, thumb: clips[i].thumb, duration: s.dur,
        views: s.views, likes: s.likes, rating: 0, comments, mine: false, short: !!s.short,
        subsBase: s.subs, sample: true, createdAt,
      };
      await putVideo(v);
      videos.push(v);
    }
    await kvSet('seeded', true);
    toast('サンプル動画を追加しました');
  } catch (e) {
    toast('サンプル動画の作成に失敗しました');
    console.error(e);
  } finally {
    clearInterval(bar);
    seeding = false;
    route();
  }
}

// ---------- router ----------
function route() {
  const h = decodeURIComponent(location.hash.slice(1) || '/');
  const [, page, arg, arg2] = h.split('/');
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('active',
    a.dataset.nav === (page || 'home') && (page !== 'playlist' || arg === WATCH_LATER)));
  document.body.classList.remove('side-open');
  $('#notifPanel').classList.remove('open');
  // stop any playing video when leaving a page
  document.querySelectorAll('video').forEach(v => v.pause());
  if (shortsObserver) { shortsObserver.disconnect(); shortsObserver = null; }
  app.className = page === 'shorts' ? 'shorts-main' : '';
  window.scrollTo(0, 0);

  if (page === 'watch') return viewWatch(arg, arg2);
  if (page === 'shorts') return viewShorts(arg);
  if (page === 'playlists') return viewPlaylists();
  if (page === 'playlist') return viewPlaylist(arg);
  if (page === 'search') return viewSearch(h.slice('/search/'.length));
  if (page === 'history') return viewHistory();
  if (page === 'liked') return viewList('👍 高く評価した動画', videos.filter(v => v.rating === 1), '動画の👍ボタンを押すと、ここに表示されます。');
  if (page === 'mine') return viewList('🎬 自分の動画', videos.filter(v => v.mine).sort((a, b) => b.createdAt - a.createdAt), '「作成」から動画をアップロードしてください。');
  if (page === 'channel') return viewChannel(arg);
  if (page === 'subscriptions') return viewSubscriptions();
  if (page === 'mypage') return viewMyPage();
  viewHome();
}

// ---------- upload ----------
let pending = null; // { file, thumb, duration }

function openUpload() {
  pending = null;
  $('#uploadForm').reset();
  $('#upChannel').value = state.me || '';
  $('#dropInner').textContent = 'クリックまたは動画ファイルをドラッグ&ドロップ';
  $('#doUpload').disabled = true;

// grab a frame from the video to use as thumbnail
const CODEC_MSG = 'この動画はブラウザで再生できない形式です（iPhone等の H.265/HEVC 形式の可能性があります）。\n' +
  '→ Chrome で開き直すか、動画を H.264 形式で書き出し直してから再度お試しください。';

function makeThumb(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const vid = document.createElement('video');
    let done = false;
    const finish = (ok, val) => {
      if (done) return;
      done = true; clearTimeout(timer); URL.revokeObjectURL(url);
      ok ? res(val) : rej(new Error(val));
    };
    const timer = setTimeout(() => finish(false, '動画の読み込みがタイムアウトしました。ファイルが壊れているか、対応していない形式の可能性があります。'), 20000);
    const draw = () => {
      // audio decodes but the video track can't (typical for HEVC) → videoWidth stays 0
      if (!vid.videoWidth || !vid.videoHeight) return finish(false, CODEC_MSG);
      const c = document.createElement('canvas');
      c.width = 480; c.height = 270;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, c.width, c.height);
      const r = Math.min(c.width / vid.videoWidth, c.height / vid.videoHeight);
      const w = vid.videoWidth * r, h = vid.videoHeight * r;
      ctx.drawImage(vid, (c.width - w) / 2, (c.height - h) / 2, w, h);
      const duration = isFinite(vid.duration) ? vid.duration : 0;
      finish(true, { thumb: c.toDataURL('image/jpeg', .8), duration, vertical: vid.videoHeight > vid.videoWidth });
    };
    vid.muted = true; vid.playsInline = true; vid.preload = 'auto';
    vid.onloadeddata = () => {
      const d = vid.duration;
      const t = isFinite(d) && d > 0 ? Math.min(2, d / 3) : 0;
      if (t > 0) { vid.onseeked = draw; vid.currentTime = t; }
      else draw();
    };
    vid.onerror = () => {
      const code = vid.error && vid.error.code;
      finish(false, code === 4 || code === 3 ? CODEC_MSG : 'ファイルを読み込めませんでした（エラーコード ' + code + '）。');
    };
    vid.src = url;
  });
}

const VIDEO_EXT = /\.(mp4|m4v|mov|webm|ogv|ogg|mkv|avi|wmv|3gp)$/i;
async function pickFile(file) {
  if (!file) return;
  // Windows sometimes reports an empty MIME type for .mp4, so fall back to the extension
  if (!file.type.startsWith('video/') && !VIDEO_EXT.test(file.name)) { toast('動画ファイルを選択してください'); return; }
  $('#dropInner').textContent = '読み込み中…';
  try {
    const { thumb, duration, vertical } = await makeThumb(file);
    pending = { file, thumb, duration };
    $('#upShort').checked = vertical || duration <= 60;
    $('#dropInner').innerHTML = `<img src="${thumb}" alt=""><div style="margin-top:8px">${esc(file.name)}（${fmtDur(duration)}）</div>`;
    if (!$('#upTitle').value) $('#upTitle').value = file.name.replace(/\.[^.]+$/, '');
    $('#doUpload').disabled = false;
  } catch (e) {
    $('#dropInner').innerHTML = `<div style="color:#d33;white-space:pre-wrap">${esc(e.message)}</div><div style="margin-top:8px">クリックして別のファイルを選ぶ</div>`;
  }
}

// ---------- wiring ----------
$('#uploadBtn').onclick = openUpload;
$('#cancelUpload').onclick = closeUpload;
$('#uploadModal').onclick = e => { if (e.target.id === 'uploadModal') closeUpload(); };
const drop = $('#drop');
drop.onclick = e => { if (e.target.id !== 'file') $('#file').click(); };
// reset value so picking the same file again (after a failure) still fires change
$('#file').onchange = e => { const f = e.target.files[0]; e.target.value = ''; pickFile(f); };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); pickFile(e.dataTransfer.files[0]); };

$('#uploadForm').onsubmit = async e => {
  e.preventDefault();
  if (!pending) return;
  const channel = $('#upChannel').value.trim();
  const v = {
    id: Math.random().toString(36).slice(2, 13),
    title: $('#upTitle').value.trim(),
    desc: $('#upDesc').value.trim(),
    channel,
    blob: pending.file,
    thumb: pending.thumb,
    duration: pending.duration,
    views: 0, likes: 0, rating: 0,
    comments: [],
    mine: true,
    short: $('#upShort').checked,
    createdAt: Date.now(),
  };
  $('#doUpload').disabled = true;
  $('#doUpload').textContent = '保存中…';
  try {
    await putVideo(v);
    videos.push(v);
    if (!state.me) { state.me = channel; await saveState(); }
    closeUpload();
    toast('動画を公開しました');
    notify(state.subs.includes(channel)
      ? `📺 ${channel} が新しい${v.short ? 'ショート' : '動画'}を公開しました:「${v.title}」`
      : `✅「${v.title}」を公開しました`, v.id);
    location.hash = v.short ? '#/shorts/' + v.id : '#/watch/' + v.id;
  } catch (err) {
    const quota = err && err.name === 'QuotaExceededError';
    alert(quota
      ? '保存に失敗しました：ブラウザの保存容量が足りません。小さい動画で試すか、不要な動画を削除してください。'
      : '保存に失敗しました：' + (err && (err.name + ' ' + err.message)));
  } finally {
    $('#doUpload').textContent = '公開';
  }
};

$('#searchForm').onsubmit = e => {
  e.preventDefault();
  const q = $('#q').value.trim();
  location.hash = q ? '#/search/' + encodeURIComponent(q) : '#/';
  document.body.classList.remove('search-mode');
  $('#q').blur();
};
// mobile: the search icon expands the header into a full-width search bar
$('#searchOpen').onclick = () => { document.body.classList.add('search-mode'); $('#q').focus(); };
$('#searchBack').onclick = () => document.body.classList.remove('search-mode');
$('#bnUpload').onclick = openUpload;
$('#menuBtn').onclick = e => {
  e.stopPropagation();
  if (matchMedia('(max-width: 1000px)').matches) document.body.classList.toggle('side-open');
  else document.body.classList.toggle('side-collapsed');
};
// tapping the dimmed area outside the drawer closes it
document.addEventListener('click', e => {
  if (document.body.classList.contains('side-open') && !e.target.closest('nav.side')) document.body.classList.remove('side-open');
});
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('miru-theme', t); } catch {}
}
$('#themeBtn').onclick = () => applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
let savedTheme = null;
try { savedTheme = localStorage.getItem('miru-theme'); } catch {}
applyTheme(savedTheme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
document.addEventListener('keydown', e => {
  if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); $('#q').focus(); }
  if (e.key === 'Escape') { closeUpload(); $('#saveModal').classList.remove('open'); $('#notifPanel').classList.remove('open'); }
});

$('#bellBtn').onclick = e => {
  e.stopPropagation();
  const p = $('#notifPanel');
  if (p.classList.toggle('open')) {
    renderNotifPanel();
    state.notifs.forEach(n => n.read = true);
    saveState(); renderBell();
  }
};
document.addEventListener('click', e => { if (!e.target.closest('.bell-wrap')) $('#notifPanel').classList.remove('open'); });

$('#closeSave').onclick = () => $('#saveModal').classList.remove('open');
$('#saveModal').onclick = e => { if (e.target.id === 'saveModal') $('#saveModal').classList.remove('open'); };
$('#newPlForm').onsubmit = async e => {
  e.preventDefault();
  const name = $('#newPlName').value.trim();
  if (!name) return;
  state.playlists.push({ id: Math.random().toString(36).slice(2, 10), name: name.slice(0, 60), ids: [saveTarget.id] });
  await saveState();
  $('#newPlName').value = '';
  renderPlChecks();
  toast(`「${name}」に保存しました`);
};

window.addEventListener('hashchange', route);

(async () => {
  try {
    db = await openDB();
    videos = await allVideos();
    state = Object.assign(state, await kvGet('state') || {});
    if (!getPl(WATCH_LATER)) state.playlists.unshift({ id: WATCH_LATER, name: '後で見る', ids: [] });
  } catch (e) {
    app.innerHTML = emptyView('⚠️', 'データベースを開けません', 'プライベートブラウズでは保存できない場合があります。', false);
    return;
  }
  renderSubs();
  renderBell();
  route();
  // first launch: populate the site with sample videos
  if (!(await kvGet('seeded'))) seedSamples();
})();
